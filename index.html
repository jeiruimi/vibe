<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vibe 网页作品集">
  <title>Vibe</title>
  <style>
    :root {
      color: #183d28;
      background: #edf6e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at top right, rgba(255, 239, 177, 0.72), transparent 35%),
        radial-gradient(circle at bottom left, rgba(143, 199, 104, 0.35), transparent 38%),
        #edf6e7;
    }

    main {
      width: min(100%, 760px);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 72px);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .intro {
      margin: 18px 0 38px;
      color: #496452;
      font-size: 18px;
      line-height: 1.7;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 28px;
      border: 1px solid rgba(48, 108, 59, 0.2);
      border-radius: 18px;
      background: rgba(255, 255, 250, 0.88);
      box-shadow: 0 20px 50px rgba(30, 73, 43, 0.16);
      color: inherit;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-5px);
      box-shadow: 0 28px 60px rgba(30, 73, 43, 0.22);
    }

    .card:focus-visible {
      outline: 3px solid #5b9a4e;
      outline-offset: 4px;
    }

    .icon {
      display: grid;
      width: 72px;
      height: 72px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: #e4f2d7;
      color: #2f7d45;
      font-size: 38px;
    }

    .content {
      min-width: 0;
      flex: 1;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #5f7d33;
      font-size: 14px;
      font-weight: 750;
    }

    .title {
      display: block;
      margin: 0;
      font-size: 25px;
      line-height: 1.25;
    }

    .description {
      margin: 10px 0 0;
      color: #58705f;
      line-height: 1.65;
    }

    .arrow {
      color: #2f7d45;
      font-size: 32px;
      transition: transform 180ms ease;
    }

    .card:hover .arrow,
    .card:focus-visible .arrow {
      transform: translateX(5px);
    }

    @media (max-width: 520px) {
      .card {
        align-items: flex-start;
        gap: 16px;
        padding: 22px;
      }

      .icon {
        width: 56px;
        height: 56px;
        font-size: 30px;
      }

      .title {
        font-size: 21px;
      }

      .arrow {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Vibe</h1>
    <p class="intro">一个小小的网页展示页，点击卡片查看源码。</p>

    <a
      class="card"
      href="https://github.com/jeiruimi/vibe/blob/main/hainan-tea-card.html"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="icon" aria-hidden="true">🍵</span>
      <span class="content">
        <span class="eyebrow">Hainan Tea</span>
        <span class="title">海南茶叶点餐</span>
        <span class="description">查看海南好茶点餐网页的 GitHub 源文件。</span>
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </main>
</body>
</html>
